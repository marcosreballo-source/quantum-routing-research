# Full Quantum v2 Configuration
# Purpose: Full production quantum training — everything quantum-enabled
# Migrated from baseline_aws_QGAT q_full_v2.yaml

problem:
  n_nodes: 20

dataset:
  data_size: 10240
  val_size: 2048

model:
  hidden_edge_dim: 64
  conv_layers: 4

quantum:
  enabled: true
  n_qubits_actor: 4
  n_qubits_critic: 4
  n_layers_quantum_actor: 4
  n_layers_quantum_critic: 2
  encoder:
    fc_node: true
    fc_edge: true
    gat_layers: [0, 1, 2, 3]
  critic:
    layers: [0, 1, 2]

training:
  lr: 3.0e-4
  batch_size: 512
  epochs: 100
  ppo_epoch: 3

mlflow:
  experiment_prefix: "QNN_Full"
