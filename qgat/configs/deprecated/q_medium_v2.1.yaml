# Medium Quantum v2 Configuration
# Purpose: Convergence validation with full encoder + critic quantum
# Migrated from baseline_aws_QGAT q_medium_v2.yaml
mode: debug

problem:
  n_nodes: 20

dataset:
  data_size: 2048
  val_size: 512

model:
  hidden_edge_dim: 64
  conv_layers: 4

quantum:
  enabled: true
  n_qubits_actor: 4
  n_layers_quantum_actor: 4

  encoder:
    fc_node: true
    fc_edge: false
    gat_layers: [0]
   # gat_attn_layers: [0]
  
  backend: 'default.qubit'
  diff_method: 'backprop'

training:
  lr: 3.0e-4
  batch_size: 32
  epochs: 100
  timestep: 1
  ppo_epoch: 1

mlflow:
  experiment_prefix: "QNN_Mediumv2"

