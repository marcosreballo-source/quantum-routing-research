# =============================================================================
# PHASE 2a — STRATEGY B: Encoder + Actor Decoder Quantum
# =============================================================================
#
# Architecture:
#   Encoder:    [Q] [Q] [Q] [Q]   ← ALL GAT layers quantum
#   Actor Dec:  [Q] [Q] [C]       ← fc + fc1 quantum projections
#   Critic:     [C] [C] [C]       ← classical Conv1D
#
# Change vs Strategy A: decoder.fc=true, decoder.fc1=true
# Tests whether quantum projections in the actor decoder help.
# =============================================================================

experiment_id: "phase2a_strategyB"

mode: debug

problem:
  n_nodes: 10

dataset:
  data_size: 512
  val_size: 128
  distribution: "uniform"

model:
  hidden_node_dim: 128
  hidden_edge_dim: 16
  conv_layers: 4
  use_ffn: false
  normalization: "batch"
  tanh_clipping: 10.0
  pool_behavior: "static"

training:
  method: ppo
  policy_mode: sampling
  lr: 1.0e-4
  batch_size: 32
  epochs: 5
  timestep: 1
  ppo_epoch: 1
  entropy_value: 0.01
  eps_clip: 0.2
  lr_decay: 1.0
  loss_weights:
    policy: 1.0
    value: 0.5
    entropy: 0.01

evaluation:
  n_samples: 128
  eval_size: 128
  beam_width: 0

quantum:
  enabled: true
  rotation: "RYRZ"
  topology: "ring"
  n_qubits_actor: 4
  n_qubits_critic: 4
  n_layers_quantum_actor: 4
  n_layers_quantum_critic: 2
  backend: "lightning.qubit"

  encoder:
    fc_node: true
    fc_edge: false
    gat_layers: [0, 1, 2, 3]

  critic:
    enabled: true
    type: "shared_conv1d"
    layers: []

  actor_decoder:
    fc: true                       # ← QUANTUM context projection
    fc1: true                      # ← QUANTUM node projection
    n_qubits: 4
    n_layers: 4

mlflow:
  experiment_prefix: "Phase2a_Ablation"
