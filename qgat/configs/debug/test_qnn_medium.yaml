experiment_id: "debug_qnn_medium"

# Medium Quantum Neural Network Configuration
# Purpose: Convergence validation (30-60 minutes) of quantum model
# Migrated from baseline_aws_QGAT — converted to unified quantum config format

problem:
  n_nodes: 20

dataset:
  data_size: 1000
  val_size: 100

model:
  hidden_node_dim: 128
  hidden_edge_dim: 16
  conv_layers: 3

quantum:
  enabled: true
  n_qubits_actor: 4
  n_qubits_critic: 4
  n_layers_quantum_actor: 4
  n_layers_quantum_critic: 2
  encoder:
    fc_node: true
    fc_edge: false
    gat_layers: [0, 1, 2]
  critic:
    layers: [0, 1, 2]

training:
  lr: 3.0e-4
  batch_size: 32
  epochs: 20
  timestep: 20
  ppo_epoch: 3
  entropy_value: 0.01
  eps_clip: 0.2

mlflow:
  experiment_prefix: "QNN_Medium"
