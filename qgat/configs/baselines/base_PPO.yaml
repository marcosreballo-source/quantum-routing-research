experiment_id: "baseline_ppo"

problem:
  n_nodes: 20 # (10, 20, 50, 100)

dataset:
  data_size: 512000      # training
  val_size: 10000        # validation

model:
  hidden_node_dim: 128
  hidden_edge_dim: 16
  conv_layers: 4

training:
  method: ppo            # (ppo, rollout)
  policy_mode: sampling  # (sampling, greedy)
  lr: 3.0e-4
  batch_size: 512
  epochs: 100
  timestep: 1
  ppo_epoch: 3
  entropy_value: 0.01
  eps_clip: 0.2

evaluation:
  n_samples: 1280
  eval_size: 1000
  temperatures:
    21: 2.5
    51: 1.8
    101: 1.2
