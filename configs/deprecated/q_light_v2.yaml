# Light Quantum v2 Configuration
# Purpose: Quick quantum training with 3 GAT layers quantum-enabled
# Migrated from baseline_aws_QGAT q_light_v2.yaml

problem:
  n_nodes: 20

dataset:
  data_size: 256
  val_size: 64

model:
  hidden_edge_dim: 32
  conv_layers: 3

quantum:
  enabled: true
  n_qubits_actor: 4
  n_qubits_critic: 4
  n_layers_quantum_actor: 4
  n_layers_quantum_critic: 2
  encoder:
    fc_node: true
    fc_edge: false
    gat_layers: [0, 1, 2]
  critic:
    layers: [0, 1, 2]

training:
  lr: 3.0e-4
  batch_size: 32
  epochs: 5
  timestep: 2
  ppo_epoch: 1

mlflow:
  experiment_prefix: "QNN_Lightv2"
