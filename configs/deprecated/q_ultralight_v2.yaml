# Ultra-Light Quantum v2 Configuration
# Purpose: Fastest quantum sanity check — single GAT layer, fc_node only
# Migrated from baseline_aws_QGAT q_ultralight_v2.yaml

mode: hybrid_cpu

problem:
  n_nodes: 10

dataset:
  data_size: 32
  val_size: 16

model:
  hidden_node_dim: 64
  conv_layers: 1

quantum:
  enabled: true
  n_qubits_actor: 4
  n_qubits_critic: 4
  n_layers_quantum_actor: 1
  n_layers_quantum_critic: 1
  encoder:
    fc_node: true
    fc_edge: false
    gat_layers: [0]
  critic:
    layers: [0]

training:
  lr: 3.0e-4
  batch_size: 4
  epochs: 1
  ppo_epoch: 1

hardware:
  use_gpu: true

mlflow:
  experiment_prefix: "QNN_UltraLightv2"
