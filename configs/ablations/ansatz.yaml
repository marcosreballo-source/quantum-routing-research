# =============================================================================
# Ablation: Ansatz topology & rotation comparison
# Purpose: Compare ring vs brickwall vs chain topologies, RYRZ vs RXRYRZ
# =============================================================================

experiment_id: "ablation_ansatz"

quantum:
  enabled: true
  rotation: "RXRYRZ"        # compare: RYRZ | RXRYRZ
  topology: "brickwall"     # compare: ring | brickwall | chain
  n_qubits_actor: 4
  n_layers_quantum_actor: 4
  encoder:
    fc_node: true
    fc_edge: false
    gat_layers: [0, 1]

dataset:
  data_size: 1024
  val_size: 256

training:
  method: rollout
  baseline: rollout
  epochs: 50
