experiment_id: "debug_quantum"

# Debug Quantum Configuration
# Purpose: Scenario #5 — verbose=2, profiler enabled, quantum on
# Uses smallest possible sizes for fast iteration

mode: debug

problem:
  n_nodes: 10

dataset:
  data_size: 20
  val_size: 5

model:
  hidden_node_dim: 64
  conv_layers: 1

quantum:
  enabled: true
  n_qubits_actor: 4
  n_qubits_critic: 4
  n_layers_quantum_actor: 1
  n_layers_quantum_critic: 1
  encoder:
    fc_node: true
    fc_edge: false
    gat_layers: [0]
  critic:
    layers: [0]

training:
  batch_size: 4
  epochs: 1
  ppo_epoch: 1

mlflow:
  experiment_prefix: "Debug_Quantum"
